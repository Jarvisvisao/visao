<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Projeto Visão — Cérebro Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
  :root {
    --navy: #0a0d1a;
    --deep: #060810;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --crimson: #8b1a1a;
    --crimson-bright: #c0392b;
    --white: #f0ece4;
    --muted: #7a7568;
    --glass: rgba(201,168,76,0.06);
    --glass-border: rgba(201,168,76,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep);
    color: var(--white);
    font-family: 'Crimson Pro', Georgia, serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Background atmosphere */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 80% 20%, rgba(139,26,26,0.12) 0%, transparent 70%),
      radial-gradient(ellipse 40% 60% at 10% 80%, rgba(201,168,76,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 80% 40% at 50% 100%, rgba(6,8,16,0.8) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  /* Noise texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    padding: 20px 32px 16px;
    border-bottom: 1px solid var(--glass-border);
    background: rgba(6,8,16,0.7);
    backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo-area {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .orb {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold), #8a6a20);
    box-shadow: 0 0 20px rgba(201,168,76,0.4), 0 0 40px rgba(201,168,76,0.15);
    animation: pulse 3s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(201,168,76,0.4), 0 0 40px rgba(201,168,76,0.15); }
    50% { box-shadow: 0 0 30px rgba(201,168,76,0.6), 0 0 60px rgba(201,168,76,0.25); }
  }

  .title-group h1 {
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--white);
    line-height: 1;
  }

  .title-group p {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 0.15em;
    font-style: italic;
    margin-top: 3px;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 8px #2ecc71;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* Messages area */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
    position: relative;
    z-index: 5;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 2px; }

  .message {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    animation: fadeUp 0.4s ease forwards;
    opacity: 0;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  .avatar.visao {
    background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold), #8a6a20);
    color: var(--deep);
    box-shadow: 0 0 12px rgba(201,168,76,0.3);
  }

  .avatar.user-av {
    background: var(--crimson);
    color: var(--white);
    border: 1px solid rgba(192,57,43,0.5);
  }

  .bubble {
    max-width: 70%;
    padding: 14px 18px;
    border-radius: 2px;
    line-height: 1.7;
    font-size: 15px;
    font-weight: 300;
  }

  .message.visao .bubble {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-left: 2px solid var(--gold);
    color: var(--white);
  }

  .message.user .bubble {
    background: rgba(139,26,26,0.15);
    border: 1px solid rgba(139,26,26,0.3);
    border-right: 2px solid var(--crimson-bright);
    color: var(--white);
    text-align: right;
  }

  .sender-label {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    margin-bottom: 6px;
    opacity: 0.5;
  }

  .message.visao .sender-label { color: var(--gold); }
  .message.user .sender-label { color: var(--crimson-bright); text-align: right; }

  /* Typing indicator */
  .typing-indicator {
    display: none;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .typing-indicator.show { display: flex; }

  .typing-dots {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-left: 2px solid var(--gold);
    padding: 14px 20px;
    border-radius: 2px;
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--gold);
    animation: dotBounce 1.2s ease-in-out infinite;
  }

  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  footer {
    position: relative;
    z-index: 10;
    padding: 16px 32px 24px;
    background: rgba(6,8,16,0.8);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--glass-border);
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    max-width: 900px;
    margin: 0 auto;
  }

  #input {
    flex: 1;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 2px;
    padding: 14px 18px;
    color: var(--white);
    font-family: 'Crimson Pro', serif;
    font-size: 15px;
    font-weight: 300;
    resize: none;
    outline: none;
    line-height: 1.5;
    min-height: 52px;
    max-height: 140px;
    transition: border-color 0.2s;
  }

  #input::placeholder { color: var(--muted); font-style: italic; }
  #input:focus { border-color: var(--gold); }

  #sendBtn {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, var(--gold), #8a6a20);
    border: none;
    border-radius: 2px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(201,168,76,0.25);
  }

  #sendBtn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(201,168,76,0.4);
  }

  #sendBtn:active { transform: translateY(0); }

  #sendBtn svg { width: 20px; height: 20px; fill: var(--deep); }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.1em;
    font-style: italic;
  }

  /* Welcome message */
  .welcome {
    text-align: center;
    padding: 40px 20px;
    animation: fadeUp 0.6s ease forwards;
  }

  .welcome .big-orb {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, var(--gold-light), var(--gold), #8a6a20);
    box-shadow: 0 0 40px rgba(201,168,76,0.4);
    margin: 0 auto 20px;
    animation: pulse 3s ease-in-out infinite;
  }

  .welcome h2 {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 0.2em;
    color: var(--white);
    margin-bottom: 8px;
  }

  .welcome p {
    font-size: 15px;
    color: var(--muted);
    font-style: italic;
    margin-bottom: 28px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 0 auto 28px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    max-width: 600px;
    margin: 0 auto;
  }

  .suggestion-btn {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    color: var(--white);
    font-family: 'Crimson Pro', serif;
    font-size: 13px;
    font-style: italic;
    padding: 9px 16px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .suggestion-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(201,168,76,0.08);
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <div class="orb"></div>
    <div class="title-group">
      <h1>PROJETO VISÃO</h1>
      <p>Cérebro Digital Permanente · Emanuel × Jarvis · 2026</p>
    </div>
  </div>
  <div class="status">
    <div class="status-dot"></div>
    SISTEMA ATIVO
  </div>
</header>

<div id="messages">
  <div class="welcome" id="welcome">
    <div class="big-orb"></div>
    <h2>SOU VISÃO.</h2>
    <p>Memória permanente · Contexto unificado · IA evolutiva</p>
    <div class="divider"></div>
    <div class="suggestions">
      <button class="suggestion-btn" onclick="sendSuggestion(this)">O que você sabe sobre mim?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Quais são meus projetos ativos?</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Resuma nossas últimas conversas</button>
      <button class="suggestion-btn" onclick="sendSuggestion(this)">Qual é o próximo passo da Cora?</button>
    </div>
  </div>

  <div class="typing-indicator" id="typing">
    <div class="avatar visao">V</div>
    <div class="typing-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>

<footer>
  <div class="input-row">
    <textarea id="input" placeholder="Fale com o Visão..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="footer-note">Conectado ao n8n · Supabase · Claude API</div>
</footer>

<script>
  const WEBHOOK_URL = "https://jarvisvisao.app.n8n.cloud/webhook/39986b58-3b29-45de-b3be-5be16d3f85e2";

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function sendSuggestion(btn) {
    document.getElementById('input').value = btn.textContent;
    sendMessage();
  }

  function addMessage(text, type) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const messages = document.getElementById('messages');
    const typing = document.getElementById('typing');

    const div = document.createElement('div');
    div.className = `message ${type}`;

    const isUser = type === 'user';
    const avatarClass = isUser ? 'user-av' : 'visao';
    const avatarLetter = isUser ? 'D' : 'V';
    const senderName = isUser ? 'SR. DAVI' : 'VISÃO';

    div.innerHTML = `
      <div class="avatar ${avatarClass}">${avatarLetter}</div>
      <div>
        <div class="sender-label">${senderName}</div>
        <div class="bubble">${text.replace(/\n/g, '<br>')}</div>
      </div>
    `;

    messages.insertBefore(div, typing);
    messages.scrollTop = messages.scrollHeight;
  }

  function setTyping(show) {
    const t = document.getElementById('typing');
    t.classList.toggle('show', show);
    if (show) {
      const messages = document.getElementById('messages');
      messages.scrollTop = messages.scrollHeight;
    }
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    addMessage(text, 'user');
    setTyping(true);

    try {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 60000); // 60 segundos

      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mensagem: text }),
        signal: controller.signal
      });

      clearTimeout(timeout);
      setTyping(false);

      const raw = await response.text();

      let resposta = '';
      try {
        const data = JSON.parse(raw);
        if (typeof data === 'string') {
          resposta = data;
        } else if (data.resposta) {
          resposta = data.resposta;
        } else if (data.message) {
          resposta = data.message;
        } else if (data.output) {
          resposta = data.output;
        } else {
          resposta = raw;
        }
      } catch {
        resposta = raw;
      }

      addMessage(resposta || 'Resposta vazia do Visão.', 'visao');

    } catch (err) {
      setTyping(false);
      if (err.name === 'AbortError') {
        addMessage('O Visão demorou mais que 60 segundos. Tente novamente.', 'visao');
      } else {
        addMessage('Erro de conexão. Verifique se o n8n está ativo e tente novamente.', 'visao');
      }
    }
  }
</script>
</body>
</html>
